[project]
name = "whs-secure-coding"
version = "1.0.0"
description = "보안을 우선한 Tiny Second-hand Shopping Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.139.2",
  "jinja2==3.1.6",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.52.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
omit = ["app/cli.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_report.py" = ["E501"]
