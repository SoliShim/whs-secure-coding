{% extends "base.html" %}
{% block title %}회원가입 · 바로마켓{% endblock %}
{% block content %}
<section class="auth-shell auth-shell-wide">
  <div class="auth-panel">
    <div class="auth-heading">
      <span class="auth-mark" aria-hidden="true">ㅂ</span>
      <p class="eyebrow">안전한 거래의 시작</p>
      <h1>바로마켓 회원가입</h1>
      <p>최소한의 정보만 받고, 비밀번호는 안전하게 보호합니다.</p>
    </div>
    <form class="form-stack" action="/register" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" value="{{ form.username or '' }}" minlength="3" maxlength="30" pattern="[A-Za-z][A-Za-z0-9_]{2,29}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-help" required>
        <small id="username-help">영문자로 시작하고 영문, 숫자, 밑줄만 사용해 3~30자로 입력하세요.</small>
      </div>
      <div class="field">
        <label for="display_name">표시 이름</label>
        <input id="display_name" name="display_name" type="text" value="{{ form.display_name or '' }}" minlength="2" maxlength="30" autocomplete="nickname" aria-describedby="display-name-help" required>
        <small id="display-name-help">상품과 채팅에서 다른 사용자에게 보이는 이름입니다.</small>
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="password">비밀번호</label>
          <div class="password-field">
            <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="password-help" required>
            <button type="button" data-password-toggle="password" aria-label="비밀번호 표시">보기</button>
          </div>
        </div>
        <div class="field">
          <label for="password_confirm">비밀번호 확인</label>
          <div class="password-field">
            <input id="password_confirm" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <button type="button" data-password-toggle="password_confirm" aria-label="비밀번호 확인 표시">보기</button>
          </div>
        </div>
      </div>
      <small id="password-help" class="form-help">12자 이상으로 만들고 다른 서비스에서 쓰지 않은 비밀번호를 권장합니다.</small>
      <button class="button button-primary button-block" type="submit">계정 만들기</button>
    </form>
    <p class="auth-switch">이미 계정이 있나요? <a href="/login">로그인</a></p>
  </div>
</section>
{% endblock %}
