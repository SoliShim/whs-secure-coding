{% extends "base.html" %}
{% block title %}로그인 · 바로마켓{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-panel">
    <div class="auth-heading">
      <span class="auth-mark" aria-hidden="true">ㅂ</span>
      <p class="eyebrow">다시 만나서 반가워요</p>
      <h1>바로마켓 로그인</h1>
      <p>내 상품과 채팅, 거래 내역을 안전하게 확인하세요.</p>
    </div>
    <form class="form-stack" action="/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" value="{{ form.username or '' }}" minlength="3" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="password-field">
          <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required>
          <button type="button" data-password-toggle="password" aria-label="비밀번호 표시">보기</button>
        </div>
      </div>
      <button class="button button-primary button-block" type="submit">안전하게 로그인</button>
    </form>
    <p class="auth-switch">아직 계정이 없나요? <a href="/register">회원가입</a></p>
    <div class="security-note">
      <span aria-hidden="true">●</span>
      <p>바로마켓은 로그인 오류에서 계정 존재 여부를 노출하지 않습니다.</p>
    </div>
  </div>
</section>
{% endblock %}
